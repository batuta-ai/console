name: Temporary native Windows graceful observation
on:
  push:
    branches: [batuta/windows-graceful-observation]
permissions:
  contents: read
jobs:
  observe:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
      CGO_ENABLED: '0'
      GOSUMDB: sum.golang.org
      GOPROXY: https://proxy.golang.org
      GONOSUMDB: ''
      GOPRIVATE: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Record runner actor and prepare private fixture at birth
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:DIAGNOSTIC_EVIDENCE = Join-Path $env:RUNNER_TEMP 'native-grace-evidence'
          $env:GOMODCACHE = Join-Path $env:RUNNER_TEMP 'native-grace-modules'
          "DIAGNOSTIC_EVIDENCE=$env:DIAGNOSTIC_EVIDENCE" >> $env:GITHUB_ENV
          "GOMODCACHE=$env:GOMODCACHE" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path $env:DIAGNOSTIC_EVIDENCE | Out-Null
          & {
            'Instrumented GitHub runner actor; no ordinary-user or release qualification claim'
            "github-actor=$env:GITHUB_ACTOR triggering-actor=$env:GITHUB_TRIGGERING_ACTOR"
            "run=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT sha=$env:GITHUB_SHA"
            whoami /all
            $PSVersionTable | Out-String
            git rev-parse HEAD
            go version
            Get-FileHash -Algorithm SHA256 -LiteralPath (Get-Command go).Source, (Get-Command git).Source, (Join-Path $PSHOME 'pwsh.exe'), ./scripts/diagnose-windows-native-grace.ps1 | Format-List
          } *> (Join-Path $env:DIAGNOSTIC_EVIDENCE 'actor-tools-source.log')
          if (-not $IsWindows -or $PSVersionTable.PSVersion.Major -lt 7 -or
              (go version) -cne 'go version go1.27.2 windows/amd64') { throw 'Native Windows PowerShell7 and Go1.27.2 required' }
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $profilePath = [Environment]::GetFolderPath([Environment+SpecialFolder]::UserProfile)
          if (-not $profilePath -or -not (Test-Path -LiteralPath $profilePath -PathType Container)) { throw 'Current-user profile required' }
          $fixture = Join-Path $profilePath ('wg-' + [guid]::NewGuid().ToString('N').Substring(0, 12))
          if ($fixture.Length -gt 160 -or (Test-Path -LiteralPath $fixture)) { throw 'New short fixture required' }
          $acl = [Security.AccessControl.DirectorySecurity]::new()
          $acl.SetOwner($sid)
          $acl.SetAccessRuleProtection($true, $false)
          $rule = [Security.AccessControl.FileSystemAccessRule]::new(
            $sid, [Security.AccessControl.FileSystemRights]::FullControl,
            [Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit',
            [Security.AccessControl.PropagationFlags]::None,
            [Security.AccessControl.AccessControlType]::Allow)
          $acl.AddAccessRule($rule)
          # Create with the protected ACL at birth; never repair an existing path.
          $directory = [IO.DirectoryInfo]::new($fixture)
          [IO.FileSystemAclExtensions]::Create($directory, $acl)
          $actual = Get-Acl -LiteralPath $fixture
          $rules = @($actual.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]))
          @("fixture=$fixture", "sid=$($sid.Value)", "sddl=$($actual.Sddl)") | Set-Content (Join-Path $env:DIAGNOSTIC_EVIDENCE 'fixture.log')
          $item = Get-Item -LiteralPath $fixture -Force
          if (-not $item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
              $actual.GetOwner([Security.Principal.SecurityIdentifier]).Value -cne $sid.Value -or
              -not $actual.AreAccessRulesProtected -or $rules.Count -ne 1 -or
              $rules[0].IdentityReference.Value -cne $sid.Value -or $rules[0].IsInherited -or
              $rules[0].FileSystemRights -ne $rule.FileSystemRights -or
              $rules[0].InheritanceFlags -ne $rule.InheritanceFlags -or
              $rules[0].PropagationFlags -ne $rule.PropagationFlags -or
              $rules[0].AccessControlType -ne $rule.AccessControlType) { throw 'Private fixture verification failed' }
          "PRIVATE_FIXTURE=$fixture" >> $env:GITHUB_ENV
      - name: Warm module cache with pinned Go before offline observation
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          go mod download 1> (Join-Path $env:DIAGNOSTIC_EVIDENCE 'modules.stdout') 2> (Join-Path $env:DIAGNOSTIC_EVIDENCE 'modules.stderr')
          $downloadExit = $LASTEXITCODE
          $downloadExit | Set-Content (Join-Path $env:DIAGNOSTIC_EVIDENCE 'modules.exit')
          exit $downloadExit
      - name: Observe once with 100 finite fresh-process iterations
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $go = (Get-Command go -CommandType Application | Select-Object -First 1).Source
          & ./scripts/diagnose-windows-native-grace.ps1 -PrivateTemp $env:PRIVATE_FIXTURE -ModuleCache $env:GOMODCACHE -Go $go -Iterations 100 1> (Join-Path $env:DIAGNOSTIC_EVIDENCE 'wrapper.stdout') 2> (Join-Path $env:DIAGNOSTIC_EVIDENCE 'wrapper.stderr')
          $diagnosticExit = $LASTEXITCODE
          $diagnosticExit | Set-Content (Join-Path $env:DIAGNOSTIC_EVIDENCE 'wrapper.exit')
          exit $diagnosticExit
      - name: Retain bounded diagnostic streams and hashes including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-grace-observation-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/native-grace-evidence/*.json
            ${{ runner.temp }}/native-grace-evidence/*.log
            ${{ runner.temp }}/native-grace-evidence/*.stdout
            ${{ runner.temp }}/native-grace-evidence/*.stderr
            ${{ runner.temp }}/native-grace-evidence/*.exit
            .batuta/runs/windows-graceful-observation/native-*/*.json
            .batuta/runs/windows-graceful-observation/native-*/*.log
            .batuta/runs/windows-graceful-observation/native-*/*.stdout
            .batuta/runs/windows-graceful-observation/native-*/*.stderr
            .batuta/runs/windows-graceful-observation/native-*/*.exit

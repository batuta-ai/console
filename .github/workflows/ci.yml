name: Console checks
on:
  pull_request:
  push:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Install pinned check tools on the runner
        env:
          GOTOOLCHAIN: local
          GOBIN: ${{ runner.temp }}/console-tools
        run: |
          npm install --global npm@12.2.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Workflow and release schema checks
        run: |
          actionlint
          node scripts/check-release-config.mjs
      - name: Shared non-root source contract
        run: sh scripts/check-release.sh
  windows-source:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
      GOSUMDB: sum.golang.org
      GONOSUMDB: ''
      GOPRIVATE: ''
    steps:
      - name: Create owned evidence directory
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP ("console-windows-evidence-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $evidence | Out-Null
          "WINDOWS_EVIDENCE=$evidence" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Record native environment and install pinned npm
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & {
            [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
            [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
            [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture
            if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') { throw 'Native Windows amd64 runner required' }
            whoami /all
            git rev-parse HEAD
            go version
            if ((go version) -ne 'go version go1.27.2 windows/amd64') { throw 'Unexpected Go toolchain' }
            node --version
            if ((node --version) -ne 'v26.10.0') { throw 'Unexpected Node toolchain' }
            npm install --global npm@12.2.0
            npm --version
            if ((npm --version) -ne '12.2.0') { throw 'Unexpected npm toolchain' }
          } *> (Join-Path $env:WINDOWS_EVIDENCE 'environment.log')
      - name: Native web tests, typecheck, build and embedded asset guard
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          function Assert-EmbeddedAssets {
            $drift = git -c core.autocrlf=false -c core.eol=lf status --porcelain --untracked-files=all -- internal/webui/dist
            if ($drift) { throw "Embedded web assets differ from HEAD: $drift" }
          }
          & {
            Assert-EmbeddedAssets
            npm --prefix web ci
            npm --prefix web run test:run
            & ./web/node_modules/.bin/tsc.cmd --noEmit --project web/tsconfig.json
            npm --prefix web run build
            Assert-EmbeddedAssets
          } *> (Join-Path $env:WINDOWS_EVIDENCE 'web.log')
      - name: Native Go builds, integrity, vet and complete original tests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
          $userProfilePath = [System.Environment]::GetFolderPath([System.Environment+SpecialFolder]::UserProfile)
          if (-not $userProfilePath -or -not (Test-Path -LiteralPath $userProfilePath -PathType Container)) { throw 'Current-user profile directory required' }
          $ancestorLog = Join-Path $env:WINDOWS_EVIDENCE 'ancestor-acls.log'
          @("current-user-sid=$($sid.Value)", "user-profile=$userProfilePath", "runner-temp=$env:RUNNER_TEMP") | Set-Content $ancestorLog
          $seenPaths = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($rootPath in @($env:RUNNER_TEMP, $userProfilePath)) {
            $ancestor = [System.IO.DirectoryInfo]::new($rootPath)
            while ($null -ne $ancestor) {
              if ($seenPaths.Add($ancestor.FullName)) {
                $ancestorAcl = Get-Acl -LiteralPath $ancestor.FullName
                @("path=$($ancestor.FullName)",
                  "owner-sid=$($ancestorAcl.GetOwner([System.Security.Principal.SecurityIdentifier]).Value)",
                  "dacl=$($ancestorAcl.GetSecurityDescriptorSddlForm([System.Security.AccessControl.AccessControlSections]::Access))") | Add-Content $ancestorLog
              }
              $ancestor = $ancestor.Parent
            }
          }
          $env:GOCACHE = Join-Path $env:RUNNER_TEMP ("console-windows-go-cache-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $env:GOCACHE | Out-Null
          # Only this new empty fixture directory receives a protected current-user ACL.
          $fixture = Join-Path $userProfilePath ("cw-" + [guid]::NewGuid().ToString('N').Substring(0, 12))
          New-Item -ItemType Directory -Path $fixture | Out-Null
          @("fixture=$fixture", "go-cache=$env:GOCACHE", "evidence=$env:WINDOWS_EVIDENCE") | Add-Content $ancestorLog
          $acl = [System.Security.AccessControl.DirectorySecurity]::new()
          $acl.SetOwner($sid)
          $acl.SetAccessRuleProtection($true, $false)
          $rule = [System.Security.AccessControl.FileSystemAccessRule]::new(
            $sid, [System.Security.AccessControl.FileSystemRights]::FullControl,
            [System.Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit',
            [System.Security.AccessControl.PropagationFlags]::None,
            [System.Security.AccessControl.AccessControlType]::Allow)
          $acl.AddAccessRule($rule)
          Set-Acl -LiteralPath $fixture -AclObject $acl
          $actual = Get-Acl -LiteralPath $fixture
          $rules = @($actual.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]))
          $actual.Sddl | Set-Content (Join-Path $env:WINDOWS_EVIDENCE 'fixture-acl.log')
          if ($actual.GetOwner([System.Security.Principal.SecurityIdentifier]).Value -ne $sid.Value -or
              -not $actual.AreAccessRulesProtected -or $rules.Count -ne 1 -or
              $rules[0].IdentityReference.Value -ne $sid.Value -or $rules[0].IsInherited -or
              $rules[0].FileSystemRights -ne $rule.FileSystemRights -or
              $rules[0].InheritanceFlags -ne $rule.InheritanceFlags -or
              $rules[0].PropagationFlags -ne $rule.PropagationFlags -or
              $rules[0].AccessControlType -ne $rule.AccessControlType) { throw 'Fixture owner/ACL verification failed' }
          & {
            go mod download
            go mod verify
            go build -o (Join-Path $env:WINDOWS_EVIDENCE 'console.exe') ./cmd/console
            go build -o (Join-Path $env:WINDOWS_EVIDENCE 'consoled.exe') ./cmd/consoled
            go vet ./...
          } *> (Join-Path $env:WINDOWS_EVIDENCE 'go-checks.log')
          $saved = @{ TEMP = $env:TEMP; TMP = $env:TMP; LOCALAPPDATA = $env:LOCALAPPDATA }
          try {
            $env:TEMP = $fixture
            $env:TMP = $fixture
            $env:LOCALAPPDATA = $fixture
            # Keep both original streams even when Go returns a failing exit code.
            $PSNativeCommandUseErrorActionPreference = $false
            go test ./... -json -count=1 -timeout=20m 1> (Join-Path $env:WINDOWS_EVIDENCE 'go-test.json') 2> (Join-Path $env:WINDOWS_EVIDENCE 'go-test.stderr')
            $testExit = $LASTEXITCODE
            $testExit | Set-Content (Join-Path $env:WINDOWS_EVIDENCE 'go-test.exit')
          } finally {
            $env:TEMP = $saved.TEMP
            $env:TMP = $saved.TMP
            $env:LOCALAPPDATA = $saved.LOCALAPPDATA
          }
          $badEvents = 0
          $passEvents = 0
          $emptyPackageOutput = @{}
          $skippedPackages = @()
          Get-Content (Join-Path $env:WINDOWS_EVIDENCE 'go-test.json') | ForEach-Object {
            $testEvent = $_ | ConvertFrom-Json -ErrorAction Stop
            if ($testEvent.Action -eq 'output' -and -not $testEvent.Test -and $testEvent.Package -and
                $testEvent.Output -cmatch ('^\?\s+' + [regex]::Escape($testEvent.Package) + '\s+\[no test files\]\r?\n?$')) {
              $emptyPackageOutput[$testEvent.Package] = $true
            }
            if ($testEvent.Action -eq 'fail' -or ($testEvent.Action -eq 'skip' -and $testEvent.Test)) { $badEvents++ }
            if ($testEvent.Action -eq 'skip' -and -not $testEvent.Test) { $skippedPackages += $testEvent.Package }
            if ($testEvent.Action -eq 'pass' -and $testEvent.Test) { $passEvents++ }
          }
          $emptyPackages = @()
          foreach ($package in $skippedPackages) {
            if ($package -and $emptyPackageOutput.ContainsKey($package)) { $emptyPackages += $package }
            else { $badEvents++ }
          }
          @("exit=$testExit pass=$passEvents fail-or-test-skip-or-unexplained-package-skip=$badEvents",
            "empty-package-count=$($emptyPackages.Count)",
            "empty-packages=$($emptyPackages -join ',')") | Set-Content (Join-Path $env:WINDOWS_EVIDENCE 'go-test-summary.log')
          if ($testExit -ne 0 -or $badEvents -ne 0 -or $passEvents -eq 0) { throw 'Complete native Go suite failed or skipped tests; see retained evidence' }
      - name: Retain native Windows evidence on success or failure
        if: always() && env.WINDOWS_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.WINDOWS_EVIDENCE }}/*.log
            ${{ env.WINDOWS_EVIDENCE }}/*.json
            ${{ env.WINDOWS_EVIDENCE }}/*.stderr
            ${{ env.WINDOWS_EVIDENCE }}/*.exit
          if-no-files-found: error
  windows-ordinary-skills:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
      GOSUMDB: sum.golang.org
      GONOSUMDB: ''
      GOPRIVATE: ''
    steps:
      - name: Create owned ordinary-user evidence directory
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP ('console-ordinary-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $evidence | Out-Null
          "ORDINARY_EVIDENCE=$evidence" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Parse both PowerShell scripts without executing the bootstrap
        run: |
          foreach ($path in @('scripts/check-windows-ordinary.ps1', 'scripts/check-windows-ordinary-child.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$parseErrors) | Out-Null
            $parseErrors | Out-String | Add-Content (Join-Path $env:ORDINARY_EVIDENCE 'parser.log')
            if ($parseErrors.Count) { throw "PowerShell parse failed: $path" }
          }
      - name: Genuine disposable ordinary-user skill proof
        run: |
          & ./scripts/check-windows-ordinary.ps1 -Evidence $env:ORDINARY_EVIDENCE
      - name: Retain ordinary-user evidence on success or failure
        if: always() && env.ORDINARY_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ordinary-skills-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ORDINARY_EVIDENCE }}/*
          if-no-files-found: error

  # TEMPORARY DIAGNOSTIC ONLY: same-source-pair Core observation; no SDK adoption.
  core-observation-native:
    name: DIAGNOSTIC ONLY Core observation (${{ matrix.variant }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        variant: [baseline, candidate]
    defaults:
      run:
        shell: bash
    env:
      GOWORK: 'off'
      GOENV: 'off'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      CGO_ENABLED: '0'
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GONOSUMDB: ''
      GOPRIVATE: ''
    steps:
      - name: Initialize owned diagnostic evidence before checkout
        run: |
          evidence=$(mktemp -d "${RUNNER_TEMP}/core-observation.XXXXXXXX")
          if [ "$RUNNER_OS" = Windows ]; then evidence=$(cygpath -m "$evidence"); fi
          echo "OBSERVATION_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          printf '%s\n' 'TEMPORARY DIAGNOSTIC ONLY: native normal journal and focused gate tests. No race, whole-Core, ordinary-user Windows, full Console proof, SDK adoption or release. Baseline gate failure must remain nonzero. Expected test events (not repeat counts): journal 42 Unix / 41 Windows pass both variants; baseline gate 15 fail + 5 pass; candidate gate 20 pass.' > "$evidence/scope.log"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Preserve full tested source and bounded native environment
        working-directory: qa/core-observation-${{ matrix.variant }}
        run: |
          cp -R . "$OBSERVATION_EVIDENCE/source"
          git rev-parse HEAD > "$OBSERVATION_EVIDENCE/checkout-head.log"
          guard_exit=0
          git status --porcelain --untracked-files=all --ignored -- . > "$OBSERVATION_EVIDENCE/source-before.log" || guard_exit=$?
          if [ -s "$OBSERVATION_EVIDENCE/source-before.log" ]; then guard_exit=1; fi
          printf '%s\n' "$guard_exit" > "$OBSERVATION_EVIDENCE/source-before-guard.exit"
          if [ "$guard_exit" -ne 0 ]; then exit "$guard_exit"; fi
          go version > "$OBSERVATION_EVIDENCE/go-version.log" 2> "$OBSERVATION_EVIDENCE/go-version.stderr"
          go env -json GOVERSION GOOS GOARCH GOHOSTOS GOHOSTARCH GOROOT GOTOOLCHAIN GOENV GOWORK GOFLAGS CGO_ENABLED GOPROXY GOSUMDB GONOSUMDB GOPRIVATE GOMODCACHE GOEXPERIMENT > "$OBSERVATION_EVIDENCE/go-env.json" 2> "$OBSERVATION_EVIDENCE/go-env.stderr"
          {
            printf 'RUNNER_OS=%s\nRUNNER_ARCH=%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            case "$RUNNER_OS" in
              Linux) expected_goos=linux ;;
              macOS) expected_goos=darwin ;;
              Windows) expected_goos=windows ;;
              *) echo 'Unknown native runner OS'; exit 1 ;;
            esac
            case "$RUNNER_ARCH" in
              X64) expected_goarch=amd64 ;;
              ARM64) expected_goarch=arm64 ;;
              *) echo 'Unknown native runner architecture'; exit 1 ;;
            esac
            actual_goversion=$(go env GOVERSION)
            actual_goos=$(go env GOOS)
            actual_goarch=$(go env GOARCH)
            if [ "$actual_goversion" != go1.27.2 ] || [ "$actual_goos" != "$expected_goos" ] || [ "$actual_goarch" != "$expected_goarch" ]; then
              echo 'Unexpected Go version or non-native target; see go-env.json'
              exit 1
            fi
          } > "$OBSERVATION_EVIDENCE/platform-guard.log" 2>&1
          go list -m -json > "$OBSERVATION_EVIDENCE/module.json" 2> "$OBSERVATION_EVIDENCE/module.stderr"
      - name: Build, vet, journal and focused gate once each with original exits
        working-directory: qa/core-observation-${{ matrix.variant }}
        run: |
          set +e
          go build ./journal ./loop > "$OBSERVATION_EVIDENCE/build.stdout" 2> "$OBSERVATION_EVIDENCE/build.stderr"
          build_exit=$?
          printf '%s\n' "$build_exit" > "$OBSERVATION_EVIDENCE/build.exit"
          go vet ./journal ./loop > "$OBSERVATION_EVIDENCE/vet.stdout" 2> "$OBSERVATION_EVIDENCE/vet.stderr"
          vet_exit=$?
          printf '%s\n' "$vet_exit" > "$OBSERVATION_EVIDENCE/vet.exit"
          go test -json -count=1 -timeout=2m ./journal > "$OBSERVATION_EVIDENCE/journal.stdout" 2> "$OBSERVATION_EVIDENCE/journal.stderr"
          journal_exit=$?
          printf '%s\n' "$journal_exit" > "$OBSERVATION_EVIDENCE/journal.exit"
          go test -json -count=1 -timeout=3m -run '^(TestSupervisionGateWaitsForJournalPublication|TestSupervisionGateCancellationWhileJournalOwned|TestSupervisionGatePreCancelledLegacyOpening|TestSupervisionJudgeReadsCurrentJournalAfterSnapshotCapture|TestSupervisionGateSnapshotStates|TestSupervisionGateSnapshotPreCancelledLegacyOpening|TestSupervisionGateSnapshotUsesCapturedJournalWithoutReacquiring|TestSupervisionGateEvidenceAndJudgment)$' ./loop > "$OBSERVATION_EVIDENCE/gate.stdout" 2> "$OBSERVATION_EVIDENCE/gate.stderr"
          gate_exit=$?
          printf '%s\n' "$gate_exit" > "$OBSERVATION_EVIDENCE/gate.exit"
          git status --porcelain --untracked-files=all --ignored -- . > "$OBSERVATION_EVIDENCE/source-after.log"
          guard_exit=$?
          if [ -s "$OBSERVATION_EVIDENCE/source-after.log" ]; then guard_exit=1; fi
          printf '%s\n' "$guard_exit" > "$OBSERVATION_EVIDENCE/source-guard.exit"
          if [ "$gate_exit" -ne 0 ]; then exit "$gate_exit"; fi
          if [ "$journal_exit" -ne 0 ]; then exit "$journal_exit"; fi
          if [ "$build_exit" -ne 0 ]; then exit "$build_exit"; fi
          if [ "$vet_exit" -ne 0 ]; then exit "$vet_exit"; fi
          exit "$guard_exit"
      - name: Always retain complete diagnostic evidence
        if: always() && env.OBSERVATION_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-observation-${{ matrix.variant }}-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OBSERVATION_EVIDENCE }}/*
          if-no-files-found: error
          include-hidden-files: true
